<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esquema digital de: Estilos y paradigmas de interacción</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Patrick+Hand&display=swap">
<style>
:root{--paper:#fbfbfd;--bg:#a9b8d6;--grid:rgba(0,0,0,.12);--ink:#15151f;--pt:#1c1c28;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);background:var(--bg);font-family:"Patrick Hand","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35}
.vp{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);scrollbar-color:var(--ink) var(--grid);scrollbar-width:auto}
.vp::-webkit-scrollbar{width:16px;height:16px}
.vp::-webkit-scrollbar-track{background:var(--grid)}
.vp::-webkit-scrollbar-thumb{background:var(--ink);border-radius:10px;border:3px solid var(--bg)}
.vp::-webkit-scrollbar-corner{background:var(--bg)}
main{min-width:1500px;max-width:1560px;margin:0 auto;padding:22px 14px 40px}
.grid{display:flex;flex-direction:column;gap:22px}
.center{order:-2;background:var(--ink);color:var(--paper);border-radius:26px 18px 28px 16px/18px 26px 16px 28px;padding:22px 20px;text-align:center;font:800 clamp(1.5rem,6.5vw,2.1rem)/1.15 Sniglet,"Arial Rounded MT Bold",system-ui,sans-serif}
.center span{display:block;font:400 .55em "Patrick Hand",sans-serif;margin-bottom:6px;opacity:.85}
.col.right{order:-1}
h2{display:inline-block;margin:0 0 14px;padding:8px 18px;border-radius:30px 18px 28px 16px;background:var(--ink);color:var(--paper);font:800 1rem Sniglet,system-ui,sans-serif;text-transform:uppercase}
.group{display:flex;flex-direction:column;gap:20px;border-left:3px solid var(--ink);border-radius:32px 0 0 32px;padding:8px 0 8px 22px;margin-left:12px}
.it{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.lab,.box{background:var(--c);color:var(--pt);border-radius:26px 16px 28px 14px/18px 26px 16px 28px;position:relative}
.it:nth-child(even) .lab,.it:nth-child(even) .box{border-radius:16px 28px 14px 26px/28px 16px 26px 18px}
.lab{font:800 1.05rem/1.1 Sniglet,system-ui,sans-serif;text-transform:uppercase;padding:13px 20px;text-align:center}
.lab small{display:block;font:400 .78rem "Patrick Hand",sans-serif;text-transform:none;margin-top:3px;opacity:.85}
.lab::after{content:"";position:absolute;top:50%;left:-22px;width:22px;border-top:3px solid var(--ink)}
.box{padding:14px 18px;max-width:440px}
.box p{margin:0 0 6px}.box ul{margin:0 0 8px;padding-left:20px}.box li{margin:1px 0}
.eh{font:800 .72rem Sniglet,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:6px 0 2px;opacity:.7}
.box a{display:block;margin-top:6px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.55);color:var(--pt);text-decoration:none;font-weight:700;word-break:break-word}
.ic{width:104px;flex:none;display:flex;align-items:center;justify-content:center}
.ic svg{width:100%;height:auto;fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ic .f{fill:var(--c)}.ic .w{fill:var(--paper)}.ic .k{fill:var(--ink);stroke:none}.ic .t{fill:var(--ink);stroke:none;font:800 26px Sniglet,system-ui,sans-serif}
.box a:hover{background:rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:1fr 250px 1fr;column-gap:44px;align-items:stretch}
.center{order:0;align-self:center}
.col{display:flex;flex-direction:column}.col.right{order:0}
.col.left h2{align-self:flex-start}.col.right h2{align-self:flex-end}
.group{flex:1;justify-content:space-around;position:relative;margin:0;border:0;border-radius:0;padding:6px 0;width:100%}
.left .group{border-right:3px solid var(--ink);border-radius:0 34px 34px 0;padding-right:20px}
.right .group{border-left:3px solid var(--ink);border-radius:34px 0 0 34px;padding-left:20px}
.left .group::after,.right .group::after{content:"";position:absolute;top:50%;width:44px;border-top:3px solid var(--ink)}
.left .group::after{right:-47px}.right .group::after{left:-47px}
.it{flex-direction:row;align-items:center;gap:26px}
.left .it{flex-direction:row-reverse;justify-content:flex-end}
.lab{width:158px;flex:none}
.box{max-width:none;flex:1}
.box::before{content:"";position:absolute;top:50%;width:26px;border-top:3px solid var(--ink)}
.left .box::before{right:-26px}.right .box::before{left:-26px}
.left .lab::after{left:auto;right:-20px;width:20px}.right .lab::after{left:-20px;width:20px}
</style>
</head>
<body>
<div class="vp"><main>
<div class="grid">
<div class="col left"><h2>Paradigmas de interacción</h2><div class="group" id="gl"></div></div>
<div class="center"><span>Esquema digital de:</span>Estilos y paradigmas de interacción</div>
<div class="col right"><h2>Estilos de interacción</h2><div class="group" id="gr"></div></div>
</div>
</main></div>

{g:'gr',n:'CLI',s:'Interfaz de Línea de Comandos',d:'Es interactuar con una computadora escribiendo comandos de texto.',c:['Se utilizan comandos escritos.','Requiere conocer la sintaxis de los comandos.','Puede ser muy rápida para usuarios expertos.','Generalmente no utiliza elementos gráficos.'],x:[['Ejemplo: JSLinux','','https://bellard.org/jslinux/vm.html?cpu=x86_64&url=alpine-x86_64.cfg&mem=256']]},

{g:'gl',n:'Realidad extendida',s:'Paradigma de realidad extendida',d:'Es un concepto que engloba tecnologías que combinan o amplían la realidad, como la realidad aumentada y la realidad virtual.',c:['Incluye realidad aumentada, realidad virtual y otras experiencias inmersivas.','Puede combinar elementos reales y virtuales.','Permite diferentes niveles de interacción e inmersión.','Integra tecnologías digitales con el entorno físico o virtual.'],x:[['Ejemplo: Paradigma de Realidad Extendida (XR)','','https://bel2428.github.io/XR1/']]},
{g:'gl',n:'Computación ubicua',s:'Paradigma de computación ubicua',d:'Es cuando la tecnología está integrada en el entorno y funciona de forma casi invisible, sin que tengas que estar pensando en la computadora.',c:['La tecnología está presente en diferentes lugares y objetos.','Puede funcionar de manera automática.','Utiliza sensores y dispositivos conectados.','Los dispositivos pueden comunicarse entre sí.','Busca que la tecnología se adapte al usuario y no al revés.'],x:[['Ejemplo: Computación ubicua','','https://bel2428.github.io/Ubicua/']]}
];
